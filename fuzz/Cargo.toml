[package]
name = "meshquill-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
meshquill-core = { version = "=0.1.0-rc.4", path = "../crates/meshquill-core" }
meshquill-mqtt = { version = "=0.1.0-rc.4", path = "../crates/meshquill-mqtt" }

[[bin]]
name = "protocol_packet"
path = "fuzz_targets/protocol_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "outer_frames"
path = "fuzz_targets/outer_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remote_payloads"
path = "fuzz_targets/remote_payloads.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mqtt_commands"
path = "fuzz_targets/mqtt_commands.rs"
test = false
doc = false
bench = false

[workspace]
