name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  workflow-lint:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run checksum-verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -no-color

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Install Linux transport headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev libudev-dev pkg-config
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check all feature combinations
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Test all targets
        # PyO3's extension-module feature intentionally omits libpython linkage on Unix. The
        # installed-wheel job below exercises that feature; native Rust tests use default features.
        run: cargo test --workspace --all-targets --locked
      - name: Build documentation with warnings denied
        shell: bash
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev libudev-dev pkg-config
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --workspace --all-targets --all-features --locked

  fuzz-smoke:
    name: Parser fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install nightly-2026-07-30 --profile minimal
      - run: cargo +nightly-2026-07-30 install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly-2026-07-30 fuzz run protocol_packet -- -max_total_time=20
      - run: cargo +nightly-2026-07-30 fuzz run outer_frames -- -max_total_time=20
      - run: cargo +nightly-2026-07-30 fuzz run remote_payloads -- -max_total_time=20
      - run: cargo +nightly-2026-07-30 fuzz run mqtt_commands -- -max_total_time=20

  python:
    name: Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            crates/meshquill-python/pyproject.toml
            crates/meshquill-python/requirements-dev.txt
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev libudev-dev pkg-config
      - name: Install Python 3.9 build tool
        if: matrix.python == '3.9'
        run: python -m pip install "maturin==1.11.5"
      - name: Install Python 3.14 quality tools
        if: matrix.python == '3.14'
        run: python -m pip install --requirement crates/meshquill-python/requirements-dev.txt
      - name: Build and install extension into the test environment
        working-directory: crates/meshquill-python
        shell: bash
        run: |
          # This job validates the extension on the runner that built it. Release wheels are built
          # and audited in the pinned manylinux container in release.yml.
          maturin build --locked --auditwheel skip --out ../../dist/python-ci
          python -m pip install --force-reinstall ../../dist/python-ci/*.whl
      - name: Check Python 3.9 installed-wheel compatibility
        if: matrix.python == '3.9'
        working-directory: crates/meshquill-python
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata
          from pathlib import Path
          import zipfile

          import meshcore_sdk
          import meshcore_sdk._native

          metadata = importlib.metadata.metadata("meshquill-sdk")
          python_version = importlib.metadata.version("meshquill-sdk")
          expected_python_version = (
              meshcore_sdk.__version__
              .replace("-rc.", "rc")
              .replace("-alpha.", "a")
              .replace("-beta.", "b")
          )
          assert metadata["Name"] == "meshquill-sdk"
          assert python_version == expected_python_version
          wheels = list(Path("../../dist/python-ci").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert any(name.endswith(".dist-info/licenses/LICENSE-MIT") for name in names)
              assert any(name.endswith(".dist-info/licenses/LICENSE-APACHE") for name in names)
          PY
          python -m pip check
          python examples/quickstart.py
          python examples/streaming.py
      - name: Check wheel metadata
        if: matrix.python == '3.14'
        working-directory: crates/meshquill-python
        run: |
          python -m twine check --strict ../../dist/python-ci/*.whl
      - name: Lint Python
        if: matrix.python == '3.14'
        working-directory: crates/meshquill-python
        run: |
          ruff format --check python examples tests
          ruff check python examples tests
      - name: Check Python types
        if: matrix.python == '3.14'
        working-directory: crates/meshquill-python
        run: |
          mypy
          python -m mypy.stubtest meshcore_sdk
          python ../../scripts/generate-python-api.py --check
      - name: Test Python SDK
        if: matrix.python == '3.14'
        working-directory: crates/meshquill-python
        run: |
          cargo build --locked --package meshquill --bin meshquill
          python -m pytest
          python examples/quickstart.py
          python examples/streaming.py

  mqtt-mosquitto:
    name: MQTT integration (Mosquitto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev libudev-dev pkg-config
      - name: Start disposable broker
        run: docker run --detach --rm --name meshquill-ci-mosquitto --publish 127.0.0.1:18884:1883 --volume "$PWD/.github/mosquitto-ci.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
      - name: Create disposable broker and client identities
        shell: bash
        run: |
          set -euo pipefail
          secure_dir="$RUNNER_TEMP/meshquill-mqtt-secure"
          mkdir --mode=0755 "$secure_dir"

          openssl genrsa -out "$secure_dir/ca.key" 2048
          openssl req -x509 -new -key "$secure_dir/ca.key" -sha256 -days 1 \
            -subj '/CN=Meshquill CI broker CA' -out "$secure_dir/ca.crt"
          openssl genrsa -out "$secure_dir/server.key" 2048
          openssl req -new -key "$secure_dir/server.key" \
            -subj '/CN=meshquill-ci-broker' -addext 'subjectAltName=IP:127.0.0.1' \
            -out "$secure_dir/server.csr"
          openssl x509 -req -in "$secure_dir/server.csr" -CA "$secure_dir/ca.crt" \
            -CAkey "$secure_dir/ca.key" -CAcreateserial -sha256 -days 1 \
            -copy_extensions copy -out "$secure_dir/server.crt"
          openssl genrsa -out "$secure_dir/client.key" 2048
          openssl req -new -key "$secure_dir/client.key" \
            -subj '/CN=meshquill-ci-client' -addext 'extendedKeyUsage=clientAuth' \
            -out "$secure_dir/client.csr"
          openssl x509 -req -in "$secure_dir/client.csr" -CA "$secure_dir/ca.crt" \
            -CAkey "$secure_dir/ca.key" -CAcreateserial -sha256 -days 1 \
            -copy_extensions copy -out "$secure_dir/client.crt"

          openssl genrsa -out "$secure_dir/wrong-ca.key" 2048
          openssl req -x509 -new -key "$secure_dir/wrong-ca.key" -sha256 -days 1 \
            -subj '/CN=Meshquill CI unrelated CA' -out "$secure_dir/wrong-ca.crt"

          docker run --rm --entrypoint mosquitto_passwd \
            --volume "$secure_dir:/work" \
            eclipse-mosquitto@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797 \
            -b -c /work/passwords meshquill-ci meshquill-test-password
          printf '%s\n' \
            'user root' \
            'per_listener_settings true' \
            'listener 8883 0.0.0.0' \
            'allow_anonymous false' \
            'password_file /mosquitto/config/passwords' \
            'cafile /mosquitto/config/ca.crt' \
            'certfile /mosquitto/config/server.crt' \
            'keyfile /mosquitto/config/server.key' \
            'require_certificate true' \
            'use_identity_as_username false' \
            'tls_version tlsv1.2' \
            'persistence false' > "$secure_dir/mosquitto.conf"
      - name: Start disposable secured broker
        shell: bash
        run: |
          docker run --detach --rm --name meshquill-ci-mosquitto-secure \
            --publish 127.0.0.1:18885:8883 \
            --volume "$RUNNER_TEMP/meshquill-mqtt-secure:/mosquitto/config:ro" \
            eclipse-mosquitto@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
          printf '%s\n' '127.0.0.1 meshquill-wrong-host.invalid' | sudo tee -a /etc/hosts >/dev/null
      - name: Wait for broker
        shell: bash
        run: |
          for attempt in {1..30}; do
            if docker logs meshquill-ci-mosquitto 2>&1 | grep -q "mosquitto version .* running" \
              && docker logs meshquill-ci-mosquitto-secure 2>&1 | grep -q "mosquitto version .* running"; then
              echo "brokers ready after $attempt attempt(s)"
              exit 0
            fi
            sleep 1
          done
          docker logs meshquill-ci-mosquitto
          docker logs meshquill-ci-mosquitto-secure
          exit 1
      - name: Exercise both protocols, TLS authentication, and allowlisted commands
        env:
          MESHQUILL_MQTT_TEST_HOST: 127.0.0.1
          MESHQUILL_MQTT_TEST_PORT: 18884
          MESHQUILL_MQTT_SECURE_TEST_HOST: 127.0.0.1
          MESHQUILL_MQTT_SECURE_TEST_PORT: 18885
          MESHQUILL_MQTT_SECURE_TEST_WRONG_HOST: meshquill-wrong-host.invalid
          MESHQUILL_MQTT_SECURE_TEST_CA: ${{ runner.temp }}/meshquill-mqtt-secure/ca.crt
          MESHQUILL_MQTT_SECURE_TEST_WRONG_CA: ${{ runner.temp }}/meshquill-mqtt-secure/wrong-ca.crt
          MESHQUILL_MQTT_SECURE_TEST_CLIENT_CERT: ${{ runner.temp }}/meshquill-mqtt-secure/client.crt
          MESHQUILL_MQTT_SECURE_TEST_CLIENT_KEY: ${{ runner.temp }}/meshquill-mqtt-secure/client.key
          MESHQUILL_MQTT_SECURE_TEST_USERNAME: meshquill-ci
          MESHQUILL_MQTT_SECURE_TEST_PASSWORD: meshquill-test-password
        run: |
          cargo test --locked --package meshquill-mqtt --test mosquitto -- --ignored --exact mosquitto_v311_roundtrip_uses_real_subscription_and_publication
          cargo test --locked --package meshquill-mqtt --test mosquitto -- --ignored --exact mosquitto_v5_roundtrip_uses_real_subscription_and_publication
          cargo test --locked --package meshquill-mqtt --test mosquitto -- --ignored --exact mosquitto_tls_auth_and_mtls_enforce_all_peer_checks
          cargo test --locked --package meshquill --test mqtt_bridge -- --ignored --exact mqtt_bridge_with_real_broker_roundtrip_send_direct_to_demo_destination
          cargo test --locked --package meshquill --test mqtt_bridge -- --ignored --exact persisted_cli_tls_mtls_and_environment_secret_connect_in_a_fresh_process
      - name: Stop disposable brokers
        if: always()
        run: |
          docker stop meshquill-ci-mosquitto || true
          docker stop meshquill-ci-mosquitto-secure || true

  docs-links:
    name: Documentation links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --root-dir . --max-retries 3 --timeout 20 --no-progress './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
