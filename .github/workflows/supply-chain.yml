name: Supply chain

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  audit-and-licences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install pinned licence policy tool
        run: cargo install cargo-deny --version 0.19.4 --locked
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo deny check
      - run: cargo audit
      - run: cargo deny --manifest-path fuzz/Cargo.toml check
      - run: cargo audit --file fuzz/Cargo.lock
