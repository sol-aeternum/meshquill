name: Supply chain

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  audit-and-licences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install pinned licence policy tool
        run: cargo install cargo-deny --version 0.19.4 --locked
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo deny check
      - run: cargo audit
      - run: cargo deny --manifest-path fuzz/Cargo.toml check
      - run: cargo audit --file fuzz/Cargo.lock
      - name: Audit exact Python build and test tools
        run: |
          python -m pip install "pip-audit==2.10.0"
          python -m pip_audit --strict --requirement crates/meshquill-python/requirements-dev.txt
