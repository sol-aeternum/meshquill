name: Supply chain

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  audit-and-licences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install pinned licence policy tool
        run: cargo install cargo-deny --version 0.19.4 --locked
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo deny check
      - run: cargo audit
      - run: cargo deny --manifest-path fuzz/Cargo.toml check
      - run: cargo audit --file fuzz/Cargo.lock
      - name: Audit exact Python build and test tools
        run: |
          python -m pip install "pip-audit==2.10.0"
          python -m pip_audit --strict --requirement crates/meshquill-python/requirements-dev.txt
