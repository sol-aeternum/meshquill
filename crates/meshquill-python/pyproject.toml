[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "meshquill-sdk"
version = "0.1.0rc1"
description = "Async Python SDK for MeshCore companions, backed by Meshquill's Rust core"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Meshquill contributors" }]
keywords = ["meshcore", "lora", "mesh", "asyncio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/sol-aeternum/meshquill"
Repository = "https://github.com/sol-aeternum/meshquill"
Issues = "https://github.com/sol-aeternum/meshquill/issues"

[dependency-groups]
dev = [
  "maturin>=1.9,<2",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9",
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "Cargo.toml"
module-name = "meshcore_sdk._native"
python-source = "python"
features = ["extension-module"]
strip = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["python", "examples", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
