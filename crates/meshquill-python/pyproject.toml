[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "meshquill-sdk"
version = "0.1.0rc4"
description = "Async Python SDK for MeshCore companions, backed by Meshquill's Rust core"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Meshquill contributors" }]
keywords = ["meshcore", "lora", "mesh", "asyncio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/sol-aeternum/meshquill"
Repository = "https://github.com/sol-aeternum/meshquill"
Issues = "https://github.com/sol-aeternum/meshquill/issues"

[dependency-groups]
dev = [
  "maturin==1.14.1",
  "jsonschema==4.26.0",
  "mypy==1.20.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.2",
  "twine==7.0.0",
  "pip-audit==2.10.1",
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "Cargo.toml"
module-name = "meshcore_sdk._native"
python-source = "python"
features = ["extension-module"]
strip = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["python", "examples", "tests"]

[[tool.mypy.overrides]]
# Pytest 9 supports Python 3.10+, but Meshquill is checked against its Python 3.9 floor.
# Skip only pytest modules that use structural pattern matching; keep the rest of its types.
module = [
  "_pytest.assertion.compare_text",
  "_pytest.assertion.rewrite",
  "_pytest.assertion.util",
  "_pytest.logging",
  "_pytest.raises",
  "_pytest.terminal",
  "_pytest.unittest",
]
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
