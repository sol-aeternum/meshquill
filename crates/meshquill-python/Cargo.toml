[package]
name = "meshquill-python"
description = "PyO3 bindings for the Meshquill Rust core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
async-trait = { workspace = true }
hex = { workspace = true }
meshquill-core = { version = "=0.1.0-rc.4", path = "../meshquill-core" }
meshquill-store = { version = "=0.1.0-rc.4", path = "../meshquill-store" }
meshquill-test-support = { version = "=0.1.0-rc.4", path = "../meshquill-test-support" }
meshquill-transport = { version = "=0.1.0-rc.4", path = "../meshquill-transport" }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { workspace = true }

[lints]
workspace = true
